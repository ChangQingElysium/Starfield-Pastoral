import groovy.json.JsonOutput
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.Path
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.regex.Pattern

// Loom 1.14.10 AbstractRunTask's public classpath setter updates its internal
// classpath, which both bare launches and getGameJvmArgs' @file branch consume.
// Capture its evaluated JVM arguments too: otherwise its lazy provider would
// point the child back to a launch.cfg/argument file regenerated by another build.
// Installation runs in a dependency task, before Gradle finalizes runClient's
// @InputFiles internalClasspath. runClient itself only reads the prepared state.
class FabricClientRuntimeSnapshot {
    static final String DLI = '-Dfabric.dli.config='

    static String digest(Path file) {
        def hash = MessageDigest.getInstance('SHA-256')
        Files.newInputStream(file).withCloseable { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) >= 0) if (count > 0) hash.update(buffer, 0, count)
        }
        hash.digest().encodeHex().toString()
    }

    static Map stamp(Path root) {
        if (!Files.exists(root, LinkOption.NOFOLLOW_LINKS)) return [exists: false, directory: true, files: [:]]
        if (Files.isSymbolicLink(root)) throw new GradleException("Snapshot input is a symbolic link: ${root}")
        if (!Files.isDirectory(root)) return [exists: true, directory: false, files: ['': digest(root)]]
        def entries = new TreeMap<String, String>()
        Files.walk(root).withCloseable { paths ->
            paths.forEach { path ->
                if (Files.isSymbolicLink(path)) throw new GradleException("Snapshot input contains a symbolic link: ${path}")
                if (Files.isRegularFile(path)) entries[root.relativize(path).toString()] = digest(path)
            }
        }
        [exists: true, directory: true, files: entries]
    }

    static void copy(Path source, Path target, Map before) {
        if (before.directory) {
            Files.createDirectories(target)
            if (before.exists) Files.walk(source).withCloseable { paths ->
                paths.forEach { path ->
                    def destination = target.resolve(source.relativize(path))
                    if (Files.isDirectory(path)) Files.createDirectories(destination)
                    else Files.copy(path, destination, StandardCopyOption.COPY_ATTRIBUTES)
                }
            }
        } else {
            Files.createDirectories(target.parent)
            Files.copy(source, target, StandardCopyOption.COPY_ATTRIBUTES)
        }
        if (stamp(source) != before || stamp(target).files != before.files) {
            throw new GradleException('Compiler or launch inputs changed during the client snapshot; retry after compilation finishes')
        }
    }

    static String rewrite(String value, Map<Path, Path> remap) {
        String result = value
        // A root must end at a path/list boundary, never inside e.g. main-other.
        remap.keySet().sort { a, b -> b.toString().length() <=> a.toString().length() }.each { from ->
            def boundaries = [File.pathSeparator, '/', '\\', '\r', '\n', '\t', ',', '"', "'"]
            def expression = Pattern.quote(from.toString()) + '(?=$|' + boundaries.collect { Pattern.quote(it) }.join('|') + ')'
            result = result.replaceAll(expression, java.util.regex.Matcher.quoteReplacement(remap[from].toString()))
        }
        result
    }

    static String encodeDli(String value) {
        def result = new StringBuilder()
        for (int i = 0; i < value.length(); i++) {
            char ch = value.charAt(i)
            if (ch == ' ' || (ch == '@' && i > 0 && value.charAt(i - 1) == '@')) {
                result.append(String.format(Locale.ROOT, '@@%04x', (int) ch))
            } else result.append(ch)
        }
        result.toString()
    }

    static String decodeDli(String value) {
        value.replaceAll('@@([0-9a-fA-F]{4})') { whole, hex -> Character.toString((char) Integer.parseInt(hex, 16)) }
    }

    static String quoteJavaArgument(String value) {
        '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '\\r').replace('\n', '\\n').replace('\t', '\\t').replace('\f', '\\f') + '"'
    }

    static Map freeze(def run, def project, File base) {
        def type = run.class
        while (type != null && type.name != 'net.fabricmc.loom.task.AbstractRunTask') type = type.superclass
        if (type == null) throw new GradleException('Client snapshot requires Loom AbstractRunTask')
        def originalClasspath = new ArrayList<File>(run.classpath.files)
        def originalJvmArguments = run.jvmArguments.get().collect { it.toString() }
        def dliArguments = originalJvmArguments.findAll { it.startsWith(DLI) }
        if (dliArguments.size() != 1) throw new GradleException('Expected exactly one Loom DLI configuration argument')
        def dli = Path.of(decodeDli(dliArguments.first().substring(DLI.length()))).toAbsolutePath().normalize()
        if (!Files.isRegularFile(dli)) throw new GradleException("Loom launch configuration is not prepared: ${dli}")
        def dliText = Files.readString(dli, StandardCharsets.UTF_8)
        def roots = new LinkedHashSet<Path>()
        ['main', 'platform'].each { name ->
            def output = project.sourceSets.getByName(name).output
            output.files.each { roots.add(it.toPath().toAbsolutePath().normalize()) }
            // Also freeze a currently absent resources root: a subsequent build
            // must not make new live resources appear in this running client.
            if (output.resourcesDir != null) roots.add(output.resourcesDir.toPath().toAbsolutePath().normalize())
        }
        def projectPath = project.projectDir.toPath().toAbsolutePath().normalize()
        originalClasspath.each { file ->
            def path = file.toPath().toAbsolutePath().normalize()
            if (Files.isDirectory(path) || path.startsWith(projectPath)) roots.add(path)
        }
        def textInputs = new LinkedHashSet<Path>()
        textInputs.add(dli)
        dliText.readLines().each { line ->
            String entry = line.trim()
            if (entry.startsWith('fabric.classPathGroups=')) {
                entry.substring(entry.indexOf('=') + 1).split(Pattern.quote(File.pathSeparator)).findAll { !it.empty }.each {
                    def path = Path.of(it).toAbsolutePath().normalize()
                    if (Files.isDirectory(path) || path.startsWith(projectPath)) roots.add(path)
                }
            }
            if (entry.startsWith('fabric.remapClasspathFile=') || entry.startsWith('log4j.configurationFile=')) {
                entry.substring(entry.indexOf('=') + 1).split(',').each {
                    def path = Path.of(it).toAbsolutePath().normalize()
                    if (!Files.isRegularFile(path)) throw new GradleException("Missing Loom launch input: ${path}")
                    textInputs.add(path)
                }
            }
        }
        roots.addAll(textInputs)
        def before = roots.collectEntries { [(it): stamp(it)] }
        Files.createDirectories(base.toPath())
        def directory = Files.createTempDirectory(base.toPath(), run.name + '-')
        def remap = new LinkedHashMap<Path, Path>()
        try {
            roots.each { from ->
                // Keep jar/config suffixes for loaders which inspect the name.
                remap[from] = directory.resolve('input-' + remap.size()).resolve(from.fileName.toString())
                copy(from, remap[from], before[from])
            }
            roots.each { if (stamp(it) != before[it]) throw new GradleException('Compiler outputs changed across snapshot roots; retry after compilation finishes') }
            textInputs.each { from ->
                Files.writeString(remap[from], rewrite(Files.readString(remap[from], StandardCharsets.UTF_8), remap), StandardCharsets.UTF_8)
            }
            def classpath = originalClasspath.collect { file ->
                def path = file.toPath().toAbsolutePath().normalize()
                remap.getOrDefault(path, path).toFile()
            }
            def argumentFiles = originalJvmArguments.findAll { it.startsWith('@') }
            if (argumentFiles.size() > 1) throw new GradleException('Expected at most one Loom JVM classpath argument file')
            def classpathArgument = directory.resolve('classpath.args')
            if (!argumentFiles.empty) {
                def original = Path.of(argumentFiles.first().substring(1))
                if (!Files.readString(original, StandardCharsets.UTF_8).startsWith('-classpath\n')) {
                    throw new GradleException('Unrecognized JVM argument file; cannot guarantee client snapshot isolation')
                }
                Files.writeString(classpathArgument, '-classpath\n' + quoteJavaArgument(classpath.collect { it.absolutePath }.join(File.pathSeparator)), StandardCharsets.UTF_8)
            }
            def frozenJvmArguments = originalJvmArguments.collect { argument ->
                if (argument.startsWith(DLI)) return DLI + encodeDli(remap[dli].toString())
                if (argument.startsWith('@')) return '@' + classpathArgument.toString()
                rewrite(argument, remap)
            }
            def state = [directory: directory.toFile(), remap: remap, textInputs: textInputs,
                         originalClasspath: originalClasspath, originalJvmArguments: originalJvmArguments,
                         classpath: classpath, jvmArguments: frozenJvmArguments, dli: remap[dli],
                         classpathArgument: argumentFiles.empty ? null : classpathArgument,
                         rootFileCounts: before.collectEntries { from, stamp -> [(from.toString()): stamp.files.size()] }]
            run.setClasspath(project.files(classpath))
            // Detach Loom's lazy getGameJvmArgs provider after capturing it. It
            // must never regenerate a shared @file or reintroduce the old DLI path.
            run.jvmArguments.set(frozenJvmArguments)
            validate(run, state)
            def manifest = proof(run, state)
            Files.writeString(directory.resolve('snapshot.json'), JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n')
            state
        } catch (Throwable failure) {
            try {
                restore(run, project, [originalClasspath: originalClasspath, originalJvmArguments: originalJvmArguments])
            } catch (Throwable restorationFailure) {
                failure.addSuppressed(restorationFailure)
            } finally {
                try {
                    project.delete(directory.toFile())
                } catch (Throwable cleanupFailure) {
                    failure.addSuppressed(cleanupFailure)
                }
            }
            throw failure
        }
    }

    static void validate(def run, Map state) {
        if (run.classpath.files.toList() != state.classpath) throw new GradleException('Loom runtime classpath did not accept the frozen entries')
        if (run.jvmArguments.get() != state.jvmArguments) throw new GradleException('Loom JVM arguments did not accept the frozen entries')
        if (run.mainClass.get() != 'net.fabricmc.devlaunchinjector.Main') throw new GradleException('Unexpected Loom launch main class')
        boolean commandProbeRequested = run.project.providers.gradleProperty('fabricClientCommandProbe').orNull == 'true'
        boolean commandProbeInstalled = run.allJvmArgs.any {
            it.startsWith('-javaagent:') && it.endsWith('/client-launch-command-probe.jar')
        }
        if (commandProbeRequested != commandProbeInstalled) {
            throw new GradleException('Command probe mode and its premain exit agent must agree before JavaExec runs')
        }
        state.classpath.each { if (!it.exists()) throw new GradleException("Missing frozen runtime classpath entry: ${it}") }
        state.textInputs.each { from ->
            def value = Files.readString(state.remap[from], StandardCharsets.UTF_8)
            if (rewrite(value, state.remap) != value) throw new GradleException('DLI configuration still references a live compiler output')
        }
        if (state.classpathArgument != null && rewrite(Files.readString(state.classpathArgument), state.remap) != Files.readString(state.classpathArgument)) {
            throw new GradleException('Loom argument file still references a live compiler output')
        }
        ['com/stardew/craft/fabric/StardewCraftFabric.class',
         'com/stardew/craft/platform/fabric/network/FabricNetwork.class', 'fabric.mod.json'].each { relative ->
            if (!state.classpath.any { it.isDirectory() && new File(it, relative).isFile() }) {
                throw new GradleException("Frozen main/platform/resources output is incomplete: ${relative}")
            }
        }
    }

    static Map proof(def run, Map state) {
        def actualJvmArguments = run.allJvmArgs.collect { it.toString() }
        boolean firstThread = actualJvmArguments.contains('-XstartOnFirstThread')
        boolean localDebugger = actualJvmArguments.contains('-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=127.0.0.1:5005')
        if (run.project.providers.gradleProperty('fabricClientDebug').orNull == 'true' && !localDebugger) {
            throw new GradleException('Requested Fabric debugger is missing the localhost-only JDWP argument')
        }
        boolean macOS = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')
        boolean debugOption = false
        // Gradle's decorated subclass overrides setters without copying method
        // annotations. Its option reader also inspects the original hierarchy.
        for (def type = run.class; type != null; type = type.superclass) {
            debugOption |= type.declaredMethods.any { method ->
                method.annotations.any { annotation ->
                    annotation.annotationType().name == 'org.gradle.api.tasks.options.Option' && annotation.option() == 'debug-jvm'
                }
            }
        }
        if (macOS && !firstThread) throw new GradleException('Loom macOS client is missing -XstartOnFirstThread')
        [schemaVersion: 1, loomVersion: '1.14.10', task: run.name, snapshot: state.directory.absolutePath,
         mainClass: run.mainClass.get(), frozenRoots: state.remap.collect { from, to ->
            [source: from.toString(), snapshot: to.toString(), files: state.rootFileCounts[from.toString()]]
         }, classpathEntries: state.classpath.size(), frozenDli: state.dli.toString(),
         privateClasspathArgumentFile: state.classpathArgument?.toString(),
         macOS: macOS, macFirstThreadJvmArgument: firstThread,
         minimumHeap2GiB: actualJvmArguments.any { it ==~ /(?i)-Xms(2g|2048m|2097152k|2147483648)/ },
         maximumHeap8GiB: actualJvmArguments.any { it ==~ /(?i)-Xmx(8g|8192m|8388608k|8589934592)/ },
         debugJvmTaskOptionAvailable: debugOption,
         localhostDebuggerEnabled: localDebugger,
         commandProbeEnabled: actualJvmArguments.any { it.startsWith('-javaagent:') && it.endsWith('/client-launch-command-probe.jar') },
         boundary: 'Runtime class/resource and DLI input isolation only; no client or graphics initialization. No environment, authentication or full launch arguments are recorded.']
    }

    static void restore(def run, def project, Map state) {
        run.setClasspath(project.files(state.originalClasspath))
        run.jvmArguments.set(state.originalJvmArguments)
    }

    static void checkFixtures(File root) {
        def directory = Files.createTempDirectory(root.toPath(), 'snapshot-fixture-')
        try {
            def source = Files.createDirectories(directory.resolve('source with space@@/classes'))
            def original = source.resolve('LateLoaded.class')
            Files.writeString(original, 'first')
            def initialTime = Files.getLastModifiedTime(original)
            def before = stamp(source)
            def snapshot = directory.resolve('frozen')
            copy(source, snapshot, before)
            Files.writeString(original, 'other')
            Files.setLastModifiedTime(original, initialTime)
            if (stamp(source) == before || Files.readString(snapshot.resolve('LateLoaded.class')) != 'first') throw new GradleException('Late compiler writes are not isolated')
            def mapping = [(source): snapshot]
            def group = source.toString() + File.pathSeparator + File.pathSeparator + source.toString()
            if (rewrite(group, mapping).contains(source.toString())) throw new GradleException('Classpath groups are not rewritten')
            if (rewrite(source.toString() + '-other', mapping) != source.toString() + '-other') throw new GradleException('A sibling path was rewritten')
            if (decodeDli(encodeDli(source.toString())) != source.toString()) throw new GradleException('DLI escaping did not round-trip')
        } finally {
            directory.toFile().deleteDir()
        }
    }
}

def fabricClientSnapshots = layout.projectDirectory.dir('.gradle/client-runtimes').asFile
def clientRun = tasks.named('runClient')
def prepareClientSnapshot = tasks.register('prepareFabricClientSnapshot') {
    description = 'Freeze client launch inputs before Gradle finalizes the runClient task inputs'
    notCompatibleWithConfigurationCache('Installs a private snapshot into the pending Loom runClient task')
    doLast {
        def run = clientRun.get()
        def state = FabricClientRuntimeSnapshot.freeze(run, project, fabricClientSnapshots)
        run.extensions.extraProperties.set('fabricClientSnapshotState', state)
        logger.lifecycle("Fabric client runtime snapshot prepared: ${state.directory}")
    }
}

// Resolve Loom's real preparation dependencies, not a guessed list of launch
// tasks. Exclude our dependency task itself to avoid a runClient -> prepare ->
// runClient dependency cycle. getDependencies returns the direct task set.
def originalClientPreparation = providers.provider {
    clientRun.get().taskDependencies.getDependencies(clientRun.get()).findAll {
        it != prepareClientSnapshot.get()
    }
}
prepareClientSnapshot.configure { dependsOn(originalClientPreparation) }

def cleanClientSnapshot = tasks.register('cleanupFabricClientSnapshot') {
    doLast {
        def run = clientRun.get()
        if (run.extensions.extraProperties.has('fabricClientSnapshotState')) {
            def state = run.extensions.extraProperties.get('fabricClientSnapshotState')
            // The runClient inputs are now final, even when launch failed.
            // Never try to restore them from a finalizer.
            delete(state.directory)
            if (state.directory.exists()) throw new GradleException('Could not remove the completed client snapshot')
        }
    }
}
clientRun.configure {
    dependsOn(prepareClientSnapshot)
    notCompatibleWithConfigurationCache('Uses a private runtime snapshot prepared before task input finalization')
    doFirst { run ->
        if (!run.extensions.extraProperties.has('fabricClientSnapshotState')) throw new GradleException('Client snapshot was not prepared before runClient execution')
        def state = run.extensions.extraProperties.get('fabricClientSnapshotState')
        FabricClientRuntimeSnapshot.validate(run, state)
        logger.lifecycle("Fabric client runtime snapshot: ${state.directory}")
    }
    finalizedBy(cleanClientSnapshot)
}

tasks.register('checkFabricClientSnapshot') {
    group = 'verification'
    description = 'Prepare real Loom client launch inputs and verify snapshot isolation without launching a client'
    // Use Loom's actual dependency graph, including assets/natives/DLI/mod setup;
    // never depend on or execute runClient itself.
    dependsOn(originalClientPreparation)
    notCompatibleWithConfigurationCache('Inspects and temporarily rewrites the real Loom runClient task without executing it')
    doLast {
        def run = clientRun.get()
        def state = FabricClientRuntimeSnapshot.freeze(run, project, fabricClientSnapshots)
        try {
            FabricClientRuntimeSnapshot.checkFixtures(fabricClientSnapshots)
            def report = FabricClientRuntimeSnapshot.proof(run, state)
            report.clientLaunched = false
            report.lateWritesIsolated = true
            report.snapshotRemovedAfterCheck = true
            def destination = layout.buildDirectory.file('reports/client-runtime-snapshot-check.json').get().asFile
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
            logger.lifecycle('Fabric client class/resource/DLI snapshot isolation verified; no client was launched.')
        } finally {
            try {
                // check does not execute runClient, so its inputs are mutable.
                FabricClientRuntimeSnapshot.restore(run, project, state)
            } finally {
                delete(state.directory)
            }
        }
    }
}

// A combined `checkFabricClientSnapshot runClient` invocation must finish the
// reversible preflight first, then install the actual run's lasting snapshot.
prepareClientSnapshot.configure { mustRunAfter(tasks.named('checkFabricClientSnapshot')) }
