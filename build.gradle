plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 targets the Java 17 runtime shipped with this Minecraft line.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// src/main/java is the bulk-ported 1.21.1 tree. src/port/java holds the narrow
// compatibility layer that re-creates the 1.21.1/NeoForge API surface the mod uses
// (network payloads, events, registries, item data) on top of Forge 1.20.1.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/port/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/port/resources', 'src/generated/resources']
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    def forgeRunDirectory = providers.gradleProperty('forgeRunDir').getOrElse('run')

    runs {
        configureEach {
            workingDirectory project.file(forgeRunDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Lets scripts/port/server_smoke.sh find (and cleanly stop) exactly this server process.
            property 'stardewcraft.runTag', providers.gradleProperty('runTag').getOrElse('none')
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(providers.gradleProperty('gameTestRunDir').getOrElse('run-game-test'))
            // Same semantics as 1.21.1's neoforge.enabledGameTestNamespaces: Forge 47 filters on the
            // template namespace (@GameTestHolder value / GameTest#templateNamespace) exactly like NeoForge,
            // and an empty value (-PgameTestNamespaces=) enables every registered test.
property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse("${mod_id},minecraft,stardewcraft_overnight_transition,stardewcraft_festival_dialogue,stardewcraft_chest_controls,stardewcraft_crop_chunk_load,stardewcraft_giant_growth,stardewcraft_utility_facing,stardewcraft_tapper_placement,stardewcraft_fishing_rules,stardewcraft_daily_info,stardewcraft_planter,stardewcraft_paving,stardewcraft_surface_floor,stardewcraft_bench,stardewcraft_fountain,stardewcraft_swing,stardewcraft_playground,stardewcraft_lamps,stardewcraft_entrances,stardewcraft_backpacks,stardewcraft_mine_assets,stardewcraft_plaza,stardewcraft_spiral_column,stardewcraft_skull_finish,stardewcraft_skull_lobby,stardewcraft_buildings,stardewcraft_pond_prefab,stardewcraft_prefab_ground,stardewcraft_animal_addons,stardewcraft_documents,stardewcraft_livestock,stardewcraft_pets,stardewcraft_pet_refinement,stardewcraft_ground_stone,stardewcraft_ordinary_mine,stardewcraft_signs,stardewcraft_npc_runtime,stardewcraft_taro,stardewcraft_pineapple,stardewcraft_cactus,stardewcraft_sweet_gem,stardewcraft_fiber,stardewcraft_qi_fruit,stardewcraft_summer_squash,stardewcraft_carrot,stardewcraft_garlic,stardewcraft_hot_pepper,stardewcraft_aquarium,stardewcraft_login,stardewcraft_play_fixes,stardewcraft_blueprint_sync,stardewcraft_sandy_soil,stardewcraft_farm_debris,stardewcraft_b008,stardewcraft_cauldrons,stardewcraft_craftables,stardewcraft_farm_twig,stardewcraft_hard_soil,stardewcraft_mini_shipping,stardewcraft_planting_soil,stardewcraft_reclamation,stardewcraft_special_orders,stardewcraft_trash_can,stardewcraft_tree_seasons,stardewcraft_supply_crate,stardewcraft_farm_golem,stardewcraft_fluid_protection,stardewcraft_wizard_placement,stardewcraft_ginger_assets,stardewcraft_port_dump,stardewcraft_palette_handoff,stardewcraft_collector_ledger,stardewcraft_greenhouse_planting,stardewcraft_template_light_loading,stardewcraft_tea_growth,stardewcraft_forage_regressions,stardewcraft_food_retrieval,stardewcraft_monster_knockback,stardewcraft_ginger_collision,stardewcraft_ginger_placement,stardewcraft_ginger_aliases,stardewcraft_ginger_boats,stardewcraft_ginger_pedestal,stardewcraft_ginger_variants,stardewcraft_sand_building,stardewcraft_fridge,stardewcraft_guild_regressions,stardewcraft_repair_regressions,stardewcraft_data_driven,stardewcraft_artifact_trove,stardewcraft_desert_travel")
            property 'stardewcraft.npcHeadlessScheduleTest', providers.gradleProperty('npcHeadlessScheduleTest').getOrElse('false')
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// MixinGradle 0.7 generates these AP side outputs in doFirst/doLast, but does
// not declare them for JavaCompile's build cache. Restore both the AP files
// and the renamed refmap used by the slim and install jars on cache hits.
afterEvaluate {
    tasks.named('compileJava', JavaCompile).configure {
        inputs.files(tasks.named('createMcpToSrg'))
                .withPropertyName('mixinReobfMappings')
                .withPathSensitivity(PathSensitivity.NONE)
        outputs.file(refMapFile).withPropertyName('mixinProcessorRefmap')
        outputs.file(outTsrgFile).withPropertyName('mixinProcessorMappings')
        outputs.file(new File(refMapFile.parentFile, refMap))
                .withPropertyName('mixinPackagedRefmap')
    }
}

repositories {
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'AppleSkin'
        url = 'https://maven.ryanliptak.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")

    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    compileOnly fg.deobf("squeek.appleskin:appleskin-forge:${appleskin_version}:api")
}

jarJar.enable()

// The jar-in-jar artifact (bundles MixinExtras, which every mixin using @WrapOperation etc. needs at runtime) is the
// distributable mod jar; the plain jar is kept as "-slim".
tasks.named('jarJar').configure {
    archiveClassifier = ''
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }
    archiveClassifier = 'slim'
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

def checkTranslations = tasks.register('checkTranslations', Exec) {
    group = 'verification'
    description = 'Checks all shipped languages for missing keys and translation argument mismatches.'
    inputs.dir(layout.projectDirectory.dir('src/main/resources/assets/stardewcraft/lang'))
    inputs.file(layout.projectDirectory.file('compatibility/verify_translations.py'))
    commandLine 'python3', layout.projectDirectory.file('compatibility/verify_translations.py').asFile.absolutePath
}

tasks.named('check') {
    dependsOn checkTranslations
}

// Prints the compile classpath for the fast direct-javac loop (scripts/port/javac_all.sh).
tasks.register('printCompileClasspath') {
    dependsOn tasks.named('createSrgToMcp')
    def cp = sourceSets.main.compileClasspath
    doLast { file("${buildDir}/port-classpath.txt").text = cp.files.join(File.pathSeparator) }
}
apply from: 'gradle/port-generated-resources.gradle'
apply from: 'gradle/api-compatibility.gradle'
apply from: 'gradle/npc-runtime.gradle'
