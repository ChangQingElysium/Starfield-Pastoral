plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Forge 1.20.1 targets the Java 17 runtime shipped with this Minecraft line.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// src/main/java is the bulk-ported 1.21.1 tree. src/port/java holds the narrow
// compatibility layer that re-creates the 1.21.1/NeoForge API surface the mod uses
// (network payloads, events, registries, item data) on top of Forge 1.20.1.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/port/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    def forgeRunDirectory = providers.gradleProperty('forgeRunDir').getOrElse('run')

    runs {
        configureEach {
            workingDirectory project.file(forgeRunDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-game-test')
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gameTestNamespaces').getOrElse(mod_id)
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    flatDir {
        dir 'libs'
    }
    maven {
        name = "Jared's maven"
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'AppleSkin'
        url = 'https://maven.ryanliptak.com/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
    jarJar(group: 'software.bernie.geckolib', name: 'geckolib-forge-1.20.1', version: "[${geckolib_version},)")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")

    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    compileOnly fg.deobf("squeek.appleskin:appleskin-forge:${appleskin_version}:api")
}

jarJar.enable()

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

def checkTranslations = tasks.register('checkTranslations', Exec) {
    group = 'verification'
    description = 'Checks all shipped languages for missing keys and translation argument mismatches.'
    inputs.dir(layout.projectDirectory.dir('src/main/resources/assets/stardewcraft/lang'))
    inputs.file(layout.projectDirectory.file('compatibility/verify_translations.py'))
    commandLine 'python3', layout.projectDirectory.file('compatibility/verify_translations.py').asFile.absolutePath
}

tasks.named('check') {
    dependsOn checkTranslations
}

// Prints the compile classpath for the fast direct-javac loop (scripts/port/javac_all.sh).
tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast { file("${buildDir}/port-classpath.txt").text = cp.files.join(File.pathSeparator) }
}
