// Use the maintained shared compilers and verification gates against Forge production sources.
apply from: 'gradle/native-npc.gradle'
apply from: 'gradle/native-furniture.gradle'

// NeoForge 1.21.1 c: tags that the mod also defines are merged (1.21.1 pack order) by
// scripts/port/import_neoforge_common_data.py into src/port/resources-merged. Those merged copies
// replace the mod's own copy of exactly the same path; any other duplicate still fails the build.
def portMergedDir = file('src/port/resources-merged')
def mainResourcesDir = file('src/main/resources')
sourceSets.main.resources.srcDir(portMergedDir)
tasks.named('processResources', ProcessResources) {
    def mergedPaths = providers.provider {
        fileTree(portMergedDir).files.collect { portMergedDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') } as Set
    }
    eachFile { details ->
        if (mergedPaths.get().contains(details.relativePath.pathString)
                && details.file.toPath().startsWith(mainResourcesDir.toPath())) {
            details.exclude()
        }
    }
}
