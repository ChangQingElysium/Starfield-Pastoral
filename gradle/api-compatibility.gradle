import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class GenerateStardewPublicApiSignature extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getClassesDirectory()

    @Internal
    abstract RegularFileProperty getJavapExecutable()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getExperimentalApiTypesFile()

    @OutputFile
    abstract RegularFileProperty getOutputFile()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void generate() {
        def experimentalTypes = experimentalApiTypesFile.get().asFile
            .readLines('UTF-8')
            .collect { it.trim() }
            .findAll { !it.isEmpty() && !it.startsWith('#') }
            .toSet()
        def classFiles = classesDirectory.asFileTree.matching {
            include 'com/stardew/craft/api/v1/**/*.class'
            exclude 'com/stardew/craft/api/v1/internal/**'
        }.files.findAll { classFile ->
            def relative = classesDirectory.get().asFile.toPath()
                .relativize(classFile.toPath())
                .toString()
                .replace(File.separatorChar, (char) '/')
            def binaryName = relative
                .substring(0, relative.length() - '.class'.length())
                .replace('/', '.')
            !experimentalTypes.any { type ->
                binaryName == type || binaryName.startsWith(type + '$')
            }
        }.sort { left, right -> left.absolutePath <=> right.absolutePath }

        if (classFiles.isEmpty()) {
            throw new GradleException('No compiled api.v1 classes were found. Run classes before generating the baseline.')
        }

        def capturedOutput = new ByteArrayOutputStream()
        execOperations.exec {
            executable javapExecutable.get().asFile.absolutePath
            args '-protected', '-s', '-constants'
            args classFiles.collect { it.absolutePath }
            standardOutput = capturedOutput
        }

        def entries = normalizeJavapOutput(capturedOutput.toString('UTF-8'))
        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(
            '# StardewCraft stable api.v1 compatibility baseline. Generated by ./gradlew generatePublicApiBaseline.\n'
                + '# Types listed in compatibility/experimental-api-v1.txt are intentionally excluded.\n'
                + '# Existing TYPE and MEMBER entries must remain available; additions are allowed.\n'
                + entries.join('\n')
                + '\n',
            'UTF-8'
        )
    }

    private static List<String> normalizeJavapOutput(String javapOutput) {
        def entries = []
        javapOutput.split(/(?=Compiled from ")/).each { section ->
            def lines = section.readLines()
            def declarationIndex = lines.findIndexOf { line ->
                !line.startsWith('Compiled from "') && !line.trim().isEmpty()
            }
            if (declarationIndex < 0) {
                return
            }

            def declaration = lines[declarationIndex].trim()
            if (!(declaration.startsWith('public ') || declaration.startsWith('protected '))) {
                return
            }

            def typeMatcher = declaration =~ /\b(?:class|interface|enum)\s+([^\s<{]+)/
            if (!typeMatcher.find()) {
                throw new GradleException("Unable to identify API type from javap declaration: ${declaration}")
            }
            def owner = typeMatcher.group(1)
            entries.add("TYPE ${declaration}")

            String pendingMember = null
            lines.drop(declarationIndex + 1).each { line ->
                def trimmed = line.trim()
                if (trimmed.isEmpty() || trimmed == '}') {
                    return
                }
                if (trimmed.startsWith('descriptor:')) {
                    if (pendingMember != null && pendingMember != 'static {};') {
                        entries.add("MEMBER ${owner} :: ${pendingMember} :: ${trimmed}")
                    }
                    pendingMember = null
                } else if (trimmed.endsWith(';')) {
                    pendingMember = trimmed
                }
            }
        }
        entries.sort()
    }
}

abstract class CheckStardewPublicApiCompatibility extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getBaselineFile()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getCurrentSignatureFile()

    @TaskAction
    void checkCompatibility() {
        def baselineEntries = readEntries(baselineFile.get().asFile)
        def currentEntries = readEntries(currentSignatureFile.get().asFile)
        def missingEntries = baselineEntries.findAll { !currentEntries.contains(it) }

        if (!missingEntries.isEmpty()) {
            def preview = missingEntries.take(40).collect { "  - ${it}" }.join('\n')
            def remainder = missingEntries.size() > 40
                ? "\n  ... and ${missingEntries.size() - 40} more"
                : ''
            throw new GradleException(
                "api.v1 compatibility check failed; ${missingEntries.size()} baseline entries are missing:\n"
                    + preview
                    + remainder
                    + '\nKeep the old signature as a bridge, or review and deliberately regenerate the baseline.'
            )
        }
    }

    private static Set<String> readEntries(File file) {
        file.readLines('UTF-8')
            .collect { it.trim() }
            .findAll { !it.isEmpty() && !it.startsWith('#') }
            .toSet()
    }
}

abstract class CheckStardewApiMaturityClassification
        extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getSourceDirectory()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getBaselineFile()

    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getExperimentalApiTypesFile()

    @TaskAction
    void checkClassification() {
        def sourceRoot = sourceDirectory.get().asFile.toPath()
        def sourceTypes = sourceDirectory.asFileTree.matching {
            include '**/*.java'
            exclude 'internal/**'
            exclude '**/package-info.java'
        }.files.collect { source ->
            sourceRoot.relativize(source.toPath())
                .toString()
                .replace(File.separatorChar, (char) '.')
                .replaceFirst(/\.java$/, '')
        }.collect { relative ->
            'com.stardew.craft.api.v1.' + relative
        }.toSet()

        def experimentalTypes = experimentalApiTypesFile.get().asFile
            .readLines('UTF-8')
            .collect { it.trim() }
            .findAll { !it.isEmpty() && !it.startsWith('#') }
            .toSet()
        def stableTypes = baselineFile.get().asFile
            .readLines('UTF-8')
            .findAll { it.startsWith('TYPE ') }
            .collect { line ->
                def matcher = line =~ /\b(?:class|interface|enum)\s+([^\s<{]+)/
                if (!matcher.find()) {
                    throw new GradleException(
                        "Unable to identify stable API type: ${line}")
                }
                matcher.group(1).split(/\$/)[0]
            }
            .toSet()

        def unclassified = (sourceTypes
            - experimentalTypes
            - stableTypes).sort()
        def staleExperimental = (experimentalTypes
            - sourceTypes).sort()
        if (!unclassified.isEmpty() || !staleExperimental.isEmpty()) {
            def details = []
            if (!unclassified.isEmpty()) {
                details.add(
                    'Unclassified API types:\n  - '
                        + unclassified.join('\n  - '))
            }
            if (!staleExperimental.isEmpty()) {
                details.add(
                    'Experimental entries without a source type:\n  - '
                        + staleExperimental.join('\n  - '))
            }
            throw new GradleException(
                'api.v1 maturity classification failed:\n'
                    + details.join('\n'))
        }
    }
}

def apiClassesDirectory = layout.buildDirectory.dir('classes/java/main')
def apiBaselineFile = layout.projectDirectory.file('compatibility/public-api-v1.txt')
def experimentalApiTypesManifest =
    layout.projectDirectory.file('compatibility/experimental-api-v1.txt')
def apiMaturityReviewManifest =
    layout.projectDirectory.file('compatibility/api-maturity-review-v1.tsv')
def currentApiSignatureFile = layout.buildDirectory.file('reports/api/current-public-api-v1.txt')
def javapExecutableProvider = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}.map { launcher ->
    launcher.metadata.installationPath.file("bin/javap")
}

def checkApiMaturityClassification = tasks.register(
    'checkApiMaturityClassification',
    CheckStardewApiMaturityClassification
) {
    group = 'verification'
    description = 'Ensures every public api.v1 source type is classified as stable or experimental.'
    sourceDirectory.set(layout.projectDirectory.dir(
        'src/main/java/com/stardew/craft/api/v1'))
    baselineFile.set(apiBaselineFile)
    experimentalApiTypesFile.set(experimentalApiTypesManifest)
}

def checkApiMaturityReview = tasks.register(
    'checkApiMaturityReview',
    Exec
) {
    group = 'verification'
    description = 'Verifies the evidence-backed decision for every non-stable api.v1 type.'
    inputs.file(experimentalApiTypesManifest)
    inputs.file(apiMaturityReviewManifest)
    inputs.file(layout.projectDirectory.file(
        'compatibility/verify_api_maturity_review.py'))
    inputs.dir(layout.projectDirectory.dir('src/main/java'))
    inputs.dir(layout.projectDirectory.dir('src/test'))
    inputs.dir(layout.projectDirectory.dir('docs'))
    inputs.dir(layout.projectDirectory.dir('examples'))
    commandLine(
        'python3',
        layout.projectDirectory.file(
            'compatibility/verify_api_maturity_review.py').asFile.absolutePath
    )
}

tasks.register('generatePublicApiBaseline', GenerateStardewPublicApiSignature) {
    group = 'verification'
    description = 'Regenerates the reviewed api.v1 compatibility baseline.'
    dependsOn tasks.named('classes')
    classesDirectory.set(apiClassesDirectory)
    javapExecutable.set(javapExecutableProvider)
    experimentalApiTypesFile.set(experimentalApiTypesManifest)
    outputFile.set(apiBaselineFile)
}

def generateCurrentPublicApiSignature = tasks.register(
    'generateCurrentPublicApiSignature',
    GenerateStardewPublicApiSignature
) {
    group = 'verification'
    description = 'Generates the current api.v1 bytecode signature for compatibility checks.'
    dependsOn tasks.named('classes')
    classesDirectory.set(apiClassesDirectory)
    javapExecutable.set(javapExecutableProvider)
    experimentalApiTypesFile.set(experimentalApiTypesManifest)
    outputFile.set(currentApiSignatureFile)
}

def checkPublicApiCompatibility = tasks.register(
    'checkPublicApiCompatibility',
    CheckStardewPublicApiCompatibility
) {
    group = 'verification'
    description = 'Fails when a reviewed api.v1 type or member signature disappears.'
    dependsOn generateCurrentPublicApiSignature
    baselineFile.set(apiBaselineFile)
    currentSignatureFile.set(currentApiSignatureFile)
}

checkPublicApiCompatibility.configure {
    mustRunAfter tasks.named('generatePublicApiBaseline')
}

tasks.named('check').configure {
    dependsOn checkPublicApiCompatibility
    dependsOn checkApiMaturityClassification
    dependsOn checkApiMaturityReview
}

tasks.register('prepareAddonCanaryJar', Sync) {
    group = 'verification'
    description = 'Copies the current main JAR to a stable path for external addon canaries.'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('compatibility')
    rename { 'stardewcraft-canary.jar' }
}
