// Authoring sources stay in the repository; the runtime never reads .bbmodel projects.
def compileNativeNpcModels = tasks.register('compileNativeNpcModels', Exec) {
    group = 'build'
    description = 'Validates and compiles the registered Generic Blockbench NPC models.'
    // Local preview GIFs/videos and QA reports are not compiler inputs.
    inputs.files(fileTree('assets-src/npc') {
        include 'models.json', '**/*.bbmodel', '**/motion.json', '**/*.motion.json'
    })
    inputs.files('tools/art/compile_native_npc.py', 'tools/art/npc_texture_atlas.py', 'tools/art/npc_joint_skin.py')
    outputs.dir(layout.buildDirectory.dir('generated/resources/nativeNpc'))
    commandLine 'python3', file('tools/art/compile_native_npc.py').absolutePath,
            file('assets-src/npc').absolutePath,
            layout.buildDirectory.dir('generated/resources/nativeNpc').get().asFile.absolutePath
}
sourceSets.main.resources.srcDir(compileNativeNpcModels)

// Replaced resources must never be packaged, including stale copies from earlier development runs.
def nativeNpcIds = new groovy.json.JsonSlurper().parseText(
        providers.fileContents(layout.projectDirectory.file('assets-src/npc/models.json')).asText.get()).keySet()
def retiredNpcPaths = nativeNpcIds.collectMany { id -> [
        "assets/stardewcraft/geo/entity/npc/${id}.geo.json".toString(),
        "assets/stardewcraft/animations/entity/npc/${id}.animation.json".toString(),
        "assets/stardewcraft/textures/entity/npc/${id}.png".toString()] }
def processedNpcResources = layout.buildDirectory.dir('resources/main').get().asFile.absolutePath
tasks.named('processResources') {
    exclude retiredNpcPaths
    doLast {
        retiredNpcPaths.each { path -> java.nio.file.Files.deleteIfExists(java.nio.file.Path.of(processedNpcResources, path)) }
    }
}

def compileNativeNpcChecks = tasks.register('compileNativeNpcChecks', JavaCompile) {
    source = files('tools/art/SamScheduleChecks.java', 'src/main/java/com/stardew/craft/npc/runtime/SamSchedulePolicy.java', 'src/main/java/com/stardew/craft/client/npcnative/NativeSamSchedulePose.java', 'tools/art/NativeConstructionChecks.java', 'tools/art/NativeGeorgeChecks.java', 'tools/art/NativeNpcChecks.java', 'tools/art/NativeCharacterChecks.java', 'tools/art/NativeClothChecks.java', 'tools/art/NativeHairChecks.java',
            'tools/art/NpcMovementCapabilityChecks.java',
            'src/main/java/com/stardew/craft/npc/animation/SamActivity.java',
            'src/main/java/com/stardew/craft/npc/data/NpcAnimationInspector.java',
            'src/main/java/com/stardew/craft/npc/data/NpcCapabilityProfile.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeNpcModel.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeNpcPose.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeNpcSkin.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeNpcCloth.java',
            'src/main/java/com/stardew/craft/client/npcnative/IdleBlinkClock.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeWalkClock.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeWheelchairClock.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeGeorgePose.java',
            'src/main/java/com/stardew/craft/npc/attention/NpcWheelchairAttentionMotion.java',
            'src/main/java/com/stardew/craft/client/npcnative/NativeSamAttentionPose.java',
            'src/main/java/com/stardew/craft/npc/attention/NpcAttentionMotion.java',
            'src/main/java/com/stardew/craft/npc/attention/NpcDialogueMotion.java',
            'src/main/java/com/stardew/craft/npc/attention/NpcStareTracker.java')
    source 'tools/art/NativeJointSkinChecks.java'
    source 'tools/art/NativeGusActivityChecks.java'
    source 'tools/art/NativeGusSupportChecks.java', 'src/main/java/com/stardew/craft/client/npcnative/NativeActivityStandingPose.java'
    source 'tools/art/NativeEvelynActivityChecks.java'
    source 'tools/art/NativeActorAnimationChecks.java', 'src/main/java/com/stardew/craft/client/npcnative/NativeActorAnimation.java'
    source 'tools/art/NativeNpcTextureChecks.java'
    source 'tools/art/NpcModelOwnershipChecks.java', 'src/main/java/com/stardew/craft/npc/data/NpcModelOwnership.java'
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/nativeNpcChecks')
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
def checkNativeNpcJointSkin = tasks.register('checkNativeNpcJointSkin', JavaExec) {
    group = 'verification'
    description = 'Checks continuous NPC joint surfaces with the production pose evaluator.'
    dependsOn compileNativeNpcChecks, compileNativeNpcModels
    classpath = files(compileNativeNpcChecks) + configurations.runtimeClasspath
    mainClass = 'NativeJointSkinChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    args layout.buildDirectory.dir('generated/resources/nativeNpc/assets/stardewcraft/npc_native').get().asFile.absolutePath,
            layout.buildDirectory.dir('reports/native-npc-joints').get().asFile.absolutePath
    if (providers.gradleProperty('nativeNpcPreview').getOrElse('false').toBoolean()) args '--preview'
}
