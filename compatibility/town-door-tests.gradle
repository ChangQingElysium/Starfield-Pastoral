// Tracked headless portal regressions; does not load a client or use local shader packs.
// ./gradlew -I compatibility/town-door-tests.gradle classes test
allprojects {
    afterEvaluate {
        if (plugins.hasPlugin('java')) {
            sourceSets.test.java.setSrcDirs([project.layout.projectDirectory.dir('compatibility/town-door')])
            sourceSets.test.resources.setSrcDirs([])
            tasks.named('test') {
                include 'com/stardew/craft/client/interior/**'
                include 'com/stardew/craft/interior/door/**'
                reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/town-door')
                reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/town-door')
            }
            tasks.register('townDoorShaderGpuCheck', JavaExec) {
                dependsOn tasks.named('testClasses')
                classpath = sourceSets.test.runtimeClasspath
                mainClass = 'com.stardew.craft.client.interior.TownDoorShaderGpuCheck'
                if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
            }
        }
    }
}
