name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install model compiler dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build check --no-daemon --console=plain

      - name: Verify stack-count Mixin mappings and packaged refmap
        run: |
          ./gradlew printCompileClasspath --no-daemon --console=plain
          bash scripts/port/test_gui_stack_count_mixin_1201.sh --check-install-jar

      - name: Test compatibility verifiers
        run: python3 -m unittest discover -s compatibility -p 'test_*.py'

      - name: Test port verification gates
        run: |
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_gametest_run_verifier.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_parity_comparison.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_camera_rewrite.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_machine_extension_rewrite.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_model_resource_conversion.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_java_math_rewrite.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_item_data_rewrite.py'
          python3 -B -m unittest discover -s scripts/port/tests -p 'test_sync_from_main.py'

      - name: Run dedicated GameTest server
        shell: bash
        run: |
          set +e
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest-ci.log
          game_test_status=${PIPESTATUS[0]}
          set -e
          python3 -B scripts/port/verify_gametest_run.py gametest-ci.log "$game_test_status"

      - name: Verify GameTest runtime shutdown
        run: >-
          python3 compatibility/verify_runtime_smoke.py
          run-game-test/logs/latest.log --scenario game-test

      - name: Build example addon
        run: ./gradlew -p examples/stardewcraft-addon build --no-daemon --console=plain

      - name: Validate example data pack
        run: python3 examples/stardewcraft-data-pack/validate.py
