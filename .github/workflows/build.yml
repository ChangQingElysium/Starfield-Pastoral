name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install model compiler dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build check --no-daemon --console=plain

      - name: Test compatibility verifiers
        run: python3 -m unittest discover -s compatibility -p 'test_*.py'

      - name: Run dedicated GameTest server
        run: ./gradlew runGameTestServer --no-daemon --console=plain

      - name: Verify GameTest runtime shutdown
        run: >-
          python3 compatibility/verify_runtime_smoke.py
          run-game-test/logs/latest.log --scenario game-test

      - name: Build example addon
        run: ./gradlew -p examples/stardewcraft-addon build --no-daemon --console=plain

      - name: Validate example data pack
        run: python3 examples/stardewcraft-data-pack/validate.py

      - name: Upload NeoForge package
        uses: actions/upload-artifact@v4
        with:
          name: stardewcraft-neoforge
          path: build/libs/stardewcraft-*.jar
          if-no-files-found: error

  fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install model compiler dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and verify Fabric package
        run: ./gradlew -p fabric check auditClientMixins remapJar packageFabricCandidate --no-daemon --console=plain

      - name: Verify production server save and reopening
        run: python3 compatibility/run_fabric_release_smoke.py

      - name: Upload Fabric package
        uses: actions/upload-artifact@v4
        with:
          name: stardewcraft-fabric
          path: |
            fabric/build/libs/stardewcraft-fabric-*.jar
            fabric/build/distributions/*-candidate.zip
          if-no-files-found: error

      - name: Upload Fabric verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-verification
          path: |
            fabric/build/test-results/platformTest/*.xml
            fabric/build/reports/mixin-audit/*.json
            fabric/build/reports/mixin-audit/*.log
            fabric/build/reports/release-smoke/*.log
            fabric/build/reports/release-smoke/summary.json
